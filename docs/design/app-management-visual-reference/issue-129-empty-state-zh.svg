    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#243451" flood-opacity=".075"/></filter>
  </defs>
  <rect width="1440" height="456" fill="url(#canvas)"/>
  <rect width="1440" height="61" fill="#ffffff"/>
  <path d="M0 60.5H1440" stroke="#e6eaf0"/>
