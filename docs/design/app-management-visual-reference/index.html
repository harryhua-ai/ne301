 zh:{nav:['功能调试','模型验证','应用管理','硬件管理','抓拍设置','系统设置','存储管理','设备信息'],labels:{deploy:'部署 App',business:'过线统计',mqtt:'MQTT/MQTTS',webhook:'Webhook',manage:'管理应用',abnormal:'应用异常',draw:'绘制计数线',flip:'交换进出方向',reset:'重置',realtime:'实时数据',params:'参数配置',advanced:'高级设置',stats:'统计与上报',period:'统计周期（分钟）',report:'MQTT 上报',save:'保存',file:'选择 .neapp 安装包',browse:'浏览文件',install:'确认部署',cancel:'取消',appstate:'应用状态',version:'版本',appId:'应用标识',pub:'发行者',run:'运行一次',update:'更新应用',uninstall:'卸载应用',confirmUninstall:'确定卸载当前应用吗？',uninstallWarning:'卸载后，当前应用的业务功能将不可用，其业务标签将从应用管理中移除。',uninstallData:'其他系统配置不应被自动清除；App 自有数据的处理以设备实际规则为准。',fileNote:'选择文件不代表通过设备签名验证。',await:'文件尚未经设备验证',details:'更多应用详情',back:'← 返回应用管理',choose:'选择文件',status:'可用',noBiz:'此设备已安装一个可信 App，但没有可在当前 Web 中显示的业务界面。',noBizSub:'点击「管理应用」可查看身份、运行一次、更新或卸载。',abnormalHeading:'无法确认应用当前状态',abnormalDetail:'设备报告应用不可用或当前查询失败。请刷新查询；在状态未确认前禁止危险操作。',refresh:'重新查询',formTitle:'MQTT/MQTTS 配置',formDesc:'原有连接与证书配置区域保持不变。',host:'服务器地址',topic:'上报主题',fileExample:'sample-app.neapp',modalDeployDesc:'选择可信的 .neapp 应用包，由设备负责验签、兼容性检查及持久安装。',current:'当前设备中的应用',verify:'仅设备确认的结果可作为安装或卸载成功依据。',runNote:'仅对受信的 v1 App 提供手动单次运行；不可自动启动或强制停止。',close:'关闭'}},
 en:{nav:['Feature Debugging','Model Validation','Application Management','Hardware Management','Capture Settings','System Settings','Storage Management','Device Info'],labels:{deploy:'Deploy App',business:'Line Counting',mqtt:'MQTT/MQTTS',webhook:'Webhook',manage:'Manage App',abnormal:'App Status',draw:'Draw Line',flip:'Swap Direction',reset:'Reset',realtime:'Live Data',params:'Parameters',advanced:'Advanced',stats:'Statistics & Reporting',period:'Period (minutes)',report:'MQTT Reporting',save:'Save',file:'Select .neapp package',browse:'Browse Files',install:'Confirm Installation',cancel:'Cancel',appstate:'App status',version:'Version',appId:'App ID',pub:'Publisher',run:'Run Once',update:'Update App',uninstall:'Uninstall App',confirmUninstall:'Uninstall the current app?',uninstallWarning:"After uninstalling, this app's features will no longer be available and its tab will be removed from Application Management.",uninstallData:'Other system configuration is not automatically removed; app-specific data follows device behavior.',fileNote:'Selecting a file does not mean the device has verified its signature.',await:'Not yet verified by device',details:'More App Details',back:'← Back to App Management',choose:'Select File',status:'Available',noBiz:'A trusted app is installed, but the current Web UI has no business view for it.',noBizSub:'Open Manage App to view identity, Run Once, update or uninstall.',abnormalHeading:'Unable to confirm current app status',abnormalDetail:'The app is unavailable or the device query failed. Refresh the status; unsafe actions remain blocked until verified.',refresh:'Refresh Status',formTitle:'MQTT/MQTTS Configuration',formDesc:'Keep the existing connection and certificate settings unchanged.',host:'Server address',topic:'Report topic',fileExample:'sample-app.neapp',modalDeployDesc:'Select a trusted .neapp package. The device verifies its signature, compatibility and committed installation.',current:'App on this device',verify:'Only device-confirmed results establish successful installation or uninstallation.',runNote:'Explicit Run Once is available only for a trusted v1 app. No auto-run or force stop.',close:'Close'}}
};document.body.classList.add('lang-'+lang);const t=dict[lang].labels;const installed=['installed','manage','update','uninstall'].includes(view),hasApp=installed||view==='no-business'||view==='manage-v1',isAbnormal=view==='abnormal',isEmpty=view==='empty'||view==='deploy';
const a=(s)=>s;const tabs=`<div class="tab-row">${isEmpty?`<div class="tab action"><span>＋</span>${t.deploy}</div>`:isAbnormal?`<div class="tab alert"><span>⚠</span>${t.abnormal}</div>`:hasApp&&!installed?`<div class="tab action"><span>⚙</span>${t.manage}</div>`:`<div class="tab active">${t.business}</div>`}<div class="tab ${isEmpty||!installed?'active':''}">${t.mqtt}</div><div class="tab">${t.webhook}</div></div>`;
const video=`<div class="business-card"><div class="video"><span class="pill-warn">${lang==='zh'?'目标类无效':'Invalid class'}</span><span class="video-mini">⟳</span><div class="line"></div><div class="arrow">→</div><span class="video-watermark">${lang==='zh'?'视频预览占位：保留既有业务组件':'Video placeholder: reuse the existing business component'}</span></div><div class="video-buttons"><button class="outline-btn">${t.draw}</button><button class="outline-btn">${t.flip}</button><button class="outline-btn">${t.reset}</button></div><div class="inner-tabs"><div class="inner-tab">${t.realtime}</div><div class="inner-tab">${t.params}</div><div class="inner-tab active">${t.advanced}</div></div><div class="setting-area"><div class="section-title">${t.stats}</div><div class="field-label">${t.period}</div><div class="field">30</div><div class="toggle-line"><span>${t.report}</span><span class="switch on"></span></div><div class="save-right"><span class="primary">${t.save}</span></div></div></div>`;
const mqtt=`<div class="basic-form"><div class="form-heading">${t.formTitle}</div><div class="subdued">${t.formDesc}</div><div class="form-row"><b>${t.host}</b><span class="subdued">mqtt.example.net</span></div><div class="form-row"><b>${t.topic}</b><span class="subdued">device/example</span></div><div class="footer-note">${lang==='zh'?'仅示意原 MQTT 页签布局；B 直接保留现有 MQTT/Webhook 页面实现。':'Illustrative MQTT section; B must retain existing MQTT and Webhook implementation.'}</div></div>`;
let content=`${tabs}<div class="toolbar">${installed?`<span class="text-action"><span class="tool-icon">⚙</span>${t.manage}</span>`:''}</div>`;

else if(view==='no-business'||view==='manage-v1')content+=`<div class="center-alert"><b>${t.noBiz}</b><div style="color:#7f6b55;font-size:13px;margin-top:5px">${t.noBizSub}</div></div>${mqtt}`;

else content+=mqtt;

document.body.insertAdjacentHTML('afterbegin',`<nav class="top-nav">${nav}</nav><main class="canvas"><div class="app-card">${content}</div></main>`);

if(view==='uninstall')modal=`<div class="modal"><div class="modal-head"><span class="modal-title">${t.manage}</span><span class="modal-close">×</span></div><div class="back-row">${t.back}</div><div class="danger-h"><span class="danger-ic">!</span>${t.confirmUninstall}</div><div class="warnbox">${t.uninstallWarning}</div><div class="info" style="margin-top:15px">${t.uninstallData}</div>${footer(t.cancel,t.uninstall,true)}</div>`;
if(modal)document.body.insertAdjacentHTML('beforeend',`<div class="overlay">${modal}</div>`);
</script>
