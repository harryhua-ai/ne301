<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="456" viewBox="0 0 1440 456" role="img" aria-labelledby="title desc">
  <title id="title">NE301 应用管理：无 App 时的应用状态页面</title>
  <desc id="desc">中性轻量空状态：尚未安装应用；可按需安装 .neapp 应用包，扩展设备功能；安装应用。MQTT/MQTTS 与 Webhook 作为独立页签，不混入当前面板。</desc>
