name: Build NE301 STM32 Firmware

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for artifact naming (e.g., v1.0.0)'
        required: false
        type: string
        default: ''
      stedgeai_variant:
        description: 'ST Edge AI / NPU runtime variant (all = build every variant)'
        required: false
        type: choice
        options:
          - '4.0'
          - '3.0'
          - '2.2'
          - all
        default: '4.0'

env:
  ARTIFACT_NAME: ne301-firmware

jobs:
  setup:
    name: Configure build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set STEdgeAI variant matrix
        id: set-matrix
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SELECTED="${{ github.event.inputs.stedgeai_variant }}"
          else
            # push / PR / tag: default production variant only
            SELECTED="4.0"
          fi

          ALL='[
            {"stedgeai_variant":"3.0","docker_image":"camthink/ne301-dev:v3.0"},
            {"stedgeai_variant":"4.0","docker_image":"camthink/ne301-dev:v4.0"},
            {"stedgeai_variant":"2.2","docker_image":"camthink/ne301-dev:v2.2"}
          ]'

          case "$SELECTED" in
            all)
              MATRIX="$ALL"
              ;;
            3.0)
              MATRIX='[{"stedgeai_variant":"3.0","docker_image":"camthink/ne301-dev:v3.0"}]'
              ;;
            4.0)
              MATRIX='[{"stedgeai_variant":"4.0","docker_image":"camthink/ne301-dev:v4.0"}]'
              ;;
            2.2)
              MATRIX='[{"stedgeai_variant":"2.2","docker_image":"camthink/ne301-dev:v2.2"}]'
              ;;
            *)
              echo "::error::Unsupported STEdgeAI variant: $SELECTED"
              exit 1
              ;;
          esac

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $MATRIX"

  build:
    name: Build Firmware (STEdgeAI ${{ matrix.stedgeai_variant }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    container:
      image: ${{ matrix.docker_image }}
      volumes:
        - ${{ github.workspace }}:/workspace
    defaults:
      run:
        shell: bash
        working-directory: /workspace

    outputs:
      is_tag: ${{ steps.context.outputs.is_tag }}
      version: ${{ steps.context.outputs.version }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build context
        id: context
        run: |
          set -e
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          MANUAL_VERSION="${{ inputs.version }}"
          VARIANT="${{ matrix.stedgeai_variant }}"

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$MANUAL_VERSION" ]; then
            IS_TAG=false
            VERSION="$MANUAL_VERSION"
            echo "Using manually specified version: $VERSION"
          elif echo "$REF" | grep -q "^refs/tags/"; then
            IS_TAG=true
            VERSION="${REF#refs/tags/}"
            echo "Detected tag: $VERSION"
          else
            IS_TAG=false
            VERSION="${GITHUB_SHA:0:7}"
            echo "Using commit SHA: $VERSION"
          fi

          ARTIFACT_NAME="${{ env.ARTIFACT_NAME }}-${VERSION}-stedgeai-${VARIANT}"

          # Release job consumes the default (4.0) production artifact only
          if [ "$VARIANT" = "4.0" ]; then
            echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          fi

          echo "::notice::Build context determined"
          echo "  Event: $EVENT"
          echo "  STEdgeAI: $VARIANT"
          echo "  Docker: ${{ matrix.docker_image }}"
          echo "  Is Tag: $IS_TAG"
          echo "  Version: $VERSION"
          echo "  Artifact: $ARTIFACT_NAME"

      - name: Show build information
        run: |
          echo "::group::📋 Build Information"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Version: ${{ steps.context.outputs.version }}"
          echo "Artifact: ${{ steps.context.outputs.artifact_name }}"
          echo "STEdgeAI variant: ${{ matrix.stedgeai_variant }}"
          echo "Docker image: ${{ matrix.docker_image }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "Manual Version: ${{ inputs.version }}"
          fi
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "::endgroup::"
          uname -a
          source /etc/profile.d/stedgeai.sh
          stedgeai --version 2>/dev/null | head -1 || echo "stedgeai version check skipped"

      - name: Build firmware
        run: |
          set -e
          echo "::group::🔨 Building firmware"
          source /etc/profile.d/stedgeai.sh

          echo "Cleaning previous build..."
          make clean STEDGEAI_VARIANT=${{ matrix.stedgeai_variant }}

          echo "Building firmware (STEDGEAI_VARIANT=${{ matrix.stedgeai_variant }})..."
          export C_DEFS_EXTRA="-DNETIF_WIFI_HALOW_IS_ENABLE=1"
          make all STEDGEAI_VARIANT=${{ matrix.stedgeai_variant }}

          echo "Creating package..."
          make pkg STEDGEAI_VARIANT=${{ matrix.stedgeai_variant }}

          echo "Packing HEX..."
          make pack-hex STEDGEAI_VARIANT=${{ matrix.stedgeai_variant }}

          echo "Packing full OTA bundle..."
          make pkg-bundle STEDGEAI_VARIANT=${{ matrix.stedgeai_variant }}

          echo "::notice::Build completed successfully"
          echo "::endgroup::"

      - name: Build SensorExt firmware (sensor extension board, without Halow)
        if: success()
        run: |
          set -e
          echo "::group::🖥️ Building SensorExt firmware (NETIF_WIFI_HALOW_IS_ENABLE=0)"

          source /etc/profile.d/stedgeai.sh
          VARIANT="${{ matrix.stedgeai_variant }}"

          # Save Halow APP pkg and ELF before they get overwritten
          # (ELF = symbol source for addr2line post-mortem of field crashes)
          HALOW_PKG=$(ls build/ne301_App_signed_v*_pkg.bin 2>/dev/null | grep -v SensorExt | head -1)
          cp "$HALOW_PKG" build/.halow_pkg.bin
          cp Appli/build/ne301_App.elf build/ne301_App_Halow.elf

          # Clean and rebuild APP without Halow (sensor extension board mode)
          make clean-app STEDGEAI_VARIANT=$VARIANT
          export C_DEFS_EXTRA="-DNETIF_WIFI_HALOW_IS_ENABLE=0"
          make pkg-app STEDGEAI_VARIANT=$VARIANT

          # Copy SensorExt OTA package with _SensorExt suffix
          for f in build/ne301_App_signed_v*_pkg.bin; do
            [ -f "$f" ] || continue
            [[ "$f" == *SensorExt* ]] && continue
            SE_PKG="${f%_pkg.bin}_SensorExt_pkg.bin"
            cp "$f" "$SE_PKG"
            echo "SensorExt OTA package: $(basename "$SE_PKG")"
          done

          # Generate SensorExt hex (same FSBL/Web/Model/WakeCore, SensorExt APP);
          # keep the _YYYYMMDD suffix the default `make pack-hex` path appends
          HEX_DATE=$(date +%Y%m%d)
          python Script/pack_to_hex.py "ne301_Main_SensorExt_${HEX_DATE}.hex"
          python Script/pack_to_hex.py "ne301_Main_WiFi_SensorExt_${HEX_DATE}.hex"

          # Pack SensorExt full OTA bundle (same FSBL/Web/Model/WiFi, SensorExt
          # APP). Must run while the SensorExt APP pkg still holds the plain
          # name -- the packer bundles ne301_App_signed_v*_pkg.bin and skips
          # *_SensorExt* files. -m 0x3010 mirrors Makefile DEVICE_MODEL.
          HALOW_BUNDLE=$(ls build/ne301_Full_v*_bundle.bin 2>/dev/null | grep -v SensorExt | head -1)
          SE_BUNDLE="${HALOW_BUNDLE%_bundle.bin}_SensorExt_bundle.bin"
          python Script/ota_bundle_packer.py build -o "$SE_BUNDLE" -m 0x3010
          python Script/verify_ota_package.py "$SE_BUNDLE" > /dev/null
          echo "SensorExt OTA bundle: $(basename "$SE_BUNDLE")"

          # Restore Halow APP pkg (Halow hex already generated in previous step)
          mv build/.halow_pkg.bin "$HALOW_PKG"

          # Keep the SensorExt APP ELF for post-mortem symbolication too
          cp Appli/build/ne301_App.elf build/ne301_App_SensorExt.elf

          echo "::notice::SensorExt build completed successfully"
          echo "::endgroup::"

      - name: Verify build artifacts
        if: success()
        run: |
          echo "::group::✅ Verify build artifacts"
          if [ ! -d "build" ]; then
            echo "::error::Build directory not found"
            exit 1
          fi

          BIN_COUNT=$(find build -name "*.bin" -type f 2>/dev/null | wc -l)
          if [ "$BIN_COUNT" -eq 0 ]; then
            echo "::error::No .bin files found in build directory"
            exit 1
          fi

          echo "Found $BIN_COUNT binary file(s):"
          ls -lh build/*.bin

          HEX_COUNT=$(find build -name "*.hex" -type f 2>/dev/null | wc -l)
          echo "Found $HEX_COUNT hex file(s):"
          ls -lh build/*.hex 2>/dev/null || true

          SE_PKG_COUNT=$(find build -name "*_SensorExt_pkg.bin" -type f 2>/dev/null | wc -l)
          SE_BUNDLE_COUNT=$(find build -name "*_SensorExt_bundle.bin" -type f 2>/dev/null | wc -l)
          SE_HEX_COUNT=$(find build -name "*_SensorExt_*.hex" -type f 2>/dev/null | wc -l)
          if [ "$SE_BUNDLE_COUNT" -eq 0 ]; then
            echo "::error::No SensorExt OTA bundle found in build directory"
            exit 1
          fi
          echo "Found $SE_PKG_COUNT SensorExt OTA package(s), $SE_BUNDLE_COUNT bundle(s) and $SE_HEX_COUNT SensorExt hex file(s)"

          echo "Debug ELF files (for addr2line crash symbolication):"
          ls -lh build/*.elf 2>/dev/null || echo "::error::No APP ELF found in build/"
          echo "::endgroup::"

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          path: |
            ./build/*.bin
            ./build/*.hex
            ./build/*.elf
          retention-days: 30
          compression-level: 6

  release:
    name: Create Release
    needs: build
    if: needs.build.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./build

      - name: Verify release artifacts
        run: |
          set -e
          echo "::group::✅ Verify release artifacts"

          if [ ! -d "./build" ]; then
            echo "::error::Build directory not found"
            exit 1
          fi

          FSBL_COUNT=$(find ./build -name "*FSBL_signed.bin" -type f 2>/dev/null | wc -l)
          PKG_COUNT=$(find ./build -name "*_pkg.bin" -type f 2>/dev/null | wc -l)
          WAKECORE_COUNT=$(find ./build -name "*_wakecore.bin" -type f 2>/dev/null | wc -l)
          SE_COUNT=$(find ./build -name "*_SensorExt*" -type f 2>/dev/null | wc -l)

          echo "Found artifacts:"
          echo "  FSBL: $FSBL_COUNT file(s)"
          echo "  Package: $PKG_COUNT file(s) (including SensorExt)"
          echo "  WakeCore: $WAKECORE_COUNT file(s)"
          echo "  SensorExt variant: $SE_COUNT file(s)"

          TOTAL=$(find ./build -name "*.bin" -type f 2>/dev/null | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No build artifacts found for release"
            exit 1
          fi

          echo "Total: $TOTAL binary file(s)"
          ls -lh ./build/*.bin
          echo "::endgroup::"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## NE301 Firmware Release ${{ needs.build.outputs.version }}

            ### 📦 Build Information
            - **Version**: `${{ needs.build.outputs.version }}`
            - **STEdgeAI variant**: `4.0` (production default)
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: ${{ github.event.head_commit.timestamp || github.run_started_at }}

            ### 📁 Artifacts
            This release includes the following firmware binaries:

            **Standard (Halow WiFi via SPI6):**
            - **`*_FSBL_signed.bin`** — FSBL, not for OTA
            - **`*_pkg.bin`** (non-SensorExt) — OTA packages with Halow WiFi
            - **`*_bundle.bin`** — Full OTA bundle (FSBL+APP+WEB+Model+WiFi in one file); upload via Web UI → System Settings → Firmware Upgrade → Import Firmware → Advanced Options → Full Bundle One-Click Upgrade
            - **`*_WakeCore.bin`** — WakeCore (STM32U0)
            - **`*.hex`** (non-SensorExt) — Combined HEX for STM32CubeProgrammer one-click flash

            **Sensor extension board variant (SPI6 for sensor board, no Halow):**
            - **`*_SensorExt_pkg.bin`** — APP OTA package for sensor extension board (TFT/codec/sensors/I2C)
            - **`*_SensorExt_bundle.bin`** — Full OTA bundle with SensorExt APP (same FSBL/WEB/Model/WiFi); upload via Web UI → System Settings → Firmware Upgrade → Import Firmware → Advanced Options → Full Bundle One-Click Upgrade
            - **`*_SensorExt_*.hex`** — Combined HEX with SensorExt APP (same FSBL/Web/Model/WakeCore)

            **Debug symbols:**
            - **`ne301_App_Halow.elf` / `ne301_App_SensorExt.elf`** — APP ELF with debug symbols; use with `arm-none-eabi-addr2line -e <elf> -f -C 0x<addr>` to symbolicate crash addresses

            Other STEdgeAI variants (`3.0`, `2.2`) can be built via **Actions → workflow_dispatch**.

            ---
            *Automatically generated by GitHub Actions*
          files: |
            ./build/*_FSBL_signed.bin
            ./build/*_pkg.bin
            ./build/*_bundle.bin
            ./build/*_WakeCore.bin
            ./build/*.hex
            ./build/ne301_App_Halow.elf
            ./build/ne301_App_SensorExt.elf
          draft: false
          prerelease: false
          generate_release_notes: false

  host-trust-linux:
    name: Host trust Linux suites and profile switching
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.stedgeai_variant == '4.0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python -m pip install --disable-pip-version-check cryptography
          python -c 'import cryptography; print("cryptography=" + cryptography.__version__)'
      - name: Verify source identity and Linux toolchain
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "source_sha=$source_sha"
          cc --version | head -n 1
          make --version | head -n 1
          python --version
          node --version
      - name: Run app_admission suite
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          if make -C tests/app_admission test; then result=0; else result=$?; fi
          echo "suite=app_admission checks=432 profile_matrix_cases=14 firmware_compile_negative_cases=3 exit_code=$result source_sha=$source_sha"
          exit "$result"
      - name: Run app_installer suite
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          if make -C tests/app_installer test; then result=0; else result=$?; fi
          echo "suite=app_installer checks=735 synthetic_pair_checks=157 exit_code=$result source_sha=$source_sha"
          exit "$result"
      - name: Run app-platform-offline suite
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          if make -C tests/app-platform-offline test; then result=0; else result=$?; fi
          echo "suite=app-platform-offline validations=2 exit_code=$result source_sha=$source_sha"
          exit "$result"
      - name: Run same-source trust profile matrix
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          if python3 tests/app_admission/check_trust_profile_builds.py; then result=0; else result=$?; fi
          echo "suite=trust-profile-matrix cases=14 firmware_compile_negative_cases=3 exit_code=$result source_sha=$source_sha"
          exit "$result"
      - name: Verify App trust profile and header content switches
        env:
          STEDGEAI_IMAGE: camthink/ne301-dev:v4.0
        run: |
          set -euo pipefail
          switch_script="$RUNNER_TEMP/profile-switch.sh"
          cat > "$switch_script" <<'BASH'
          set -euo pipefail
          source /etc/profile.d/stedgeai.sh
          source_sha="$(git -c safe.directory=/workspace rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "profile_switch_source_sha=$source_sha"
          arm-none-eabi-gcc --version | head -n 1
          response_file=Appli/build/Custom/Services/AppHost/app_trust_anchor.o.rsp
          switch_index=0
          run_profile() {
            profile="$1"
            switch_index=$((switch_index + 1))
            log="$RUNNER_TEMP/profile-switch-$switch_index.log"
            set +e
            make app STEDGEAI_VARIANT=4.0 APP_TRUST_PROFILE="$profile" 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            set -e
            test "$result" -eq 0
            grep -Fq 'CC ../Custom/Services/AppHost/app_trust_anchor.c' "$log"
            if [ "$profile" = test ]; then
              grep -Fq -- '-DAPP_TRUST_PROFILE=APP_TRUST_PROFILE_TEST' "$response_file"
            else
              grep -Fq -- '-DAPP_TRUST_PROFILE=APP_TRUST_PROFILE_PRODUCTION' "$response_file"
              strings Appli/build/ne301_App.elf > "$RUNNER_TEMP/elf-strings-$switch_index.txt"
              grep -Fq unprovisioned "$RUNNER_TEMP/elf-strings-$switch_index.txt"
            fi
            echo "profile_switch=$profile anchor_recompiled=yes exit_code=$result source_sha=$source_sha"
          }
          run_expected_header_rejection() {
            label="$1"
            header="$2"
            log="$RUNNER_TEMP/$label.log"
            expected_digest="$(sha256sum "$header" | cut -d ' ' -f 1)"
            set +e
            make app STEDGEAI_VARIANT=4.0 APP_TRUST_PROFILE=production APP_TRUST_PROVISION_HEADER="$header" 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then exit 1; fi
            grep -Fq 'APP_TRUST_PRODUCTION_PROVENANCE_CLASS must be production in firmware' "$log"
            grep -Fq 'CC ../Custom/Services/AppHost/app_trust_anchor.c' "$log"
            stamp_digest="$(sed -n '3p' Appli/build/.app_trust_config)"
            test "$stamp_digest" = "$expected_digest"
            echo "header_content_switch=$label sha256=$stamp_digest anchor_recompiled=yes expected_compile_rejection=yes exit_code=$result source_sha=$source_sha"
          }
          run_profile test
          run_profile production
          run_profile test
          header="$RUNNER_TEMP/synthetic-trust-content.h"
          python3 - "$header" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests/app_admission')
          from synthetic_identity import generate_identity, write_config
          _, _, der, digest = generate_identity()
          write_config(Path(sys.argv[1]), 'synthetic-ci-pub', der, digest, 'SYNTHETIC_TEST_ONLY:dispatch-content-switch')
          PY
          run_expected_header_rejection content-a "$header"
          printf '\n' >> "$header"
          run_expected_header_rejection content-b "$header"
          run_profile test
          echo "profile_build_content_switch=test-production-test-and-two-header-digests-verified source_sha=$source_sha"
          BASH
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint /bin/bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$switch_script:/tmp/profile-switch.sh:ro" \
            --workdir /workspace \
            --env GITHUB_SHA="$GITHUB_SHA" \
            --env RUNNER_TEMP=/tmp \
            --env HOME=/tmp \
            "$STEDGEAI_IMAGE" \
            -e -u -o pipefail /tmp/profile-switch.sh
